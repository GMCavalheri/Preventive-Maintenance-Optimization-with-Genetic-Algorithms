[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmo"
version = "0.1.0"
description = "Preventive maintenance scheduling for an aircraft fleet with genetic algorithms, benchmarked against fixed-interval heuristics and an exact CP-SAT model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "deap>=1.4",
    "ortools>=9.10",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
